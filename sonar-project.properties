sonar.projectKey=aosedge_aos_core_cpp
sonar.organization=aosedge

sonar.sources=src/
sonar.exclusions=**/tests/**,src/sm/launcher/runtimes/container/libcrun.hpp

sonar.tests=src/
sonar.test.inclusions=**/tests/**

sonar.coverage.exclusions=**/tests/**

sonar.cfamily.compile-commands=build/compile_commands.json

# Ignore cpp:M23_007 (the value returned by a function shall be used) in the cloud protocol and
# OCI spec serialization code and in the CM and SM database implementations only: flagged on
# every Poco::JSON::Object::set() and Poco::JSON::Array::add() call, which return a reference to
# the object itself to allow call chaining. These files build JSON field by field, so casting
# each call to void would only add noise.
#
# Ignore cpp:M23_058 (builtin integer types should be replaced with aliases of explicit size):
# int, long and unsigned char are mostly dictated by the external APIs used throughout the code
# (POSIX file descriptors and return codes, signal handlers, Poco, curl, libnl, systemd, sqlite
# column types, gRPC channel arguments), and replacing only the remaining ones would mix two
# conventions for the same values.
#
# Ignore cpp:S1181 (generic exceptions should not be caught): catch (const std::exception&) is
# used at the module boundaries, where every exception thrown by std, Poco and other third-party
# code has to be converted to aos::Error. Catching narrower types would let the other exceptions
# escape from functions that report failures through the returned error.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=cpp:M23_007
sonar.issue.ignore.multicriteria.e1.resourceKey=**/common/cloudprotocol/**
sonar.issue.ignore.multicriteria.e2.ruleKey=cpp:M23_007
sonar.issue.ignore.multicriteria.e2.resourceKey=**/common/ocispec/**
sonar.issue.ignore.multicriteria.e3.ruleKey=cpp:M23_007
sonar.issue.ignore.multicriteria.e3.resourceKey=**/cm/database/database.cpp
sonar.issue.ignore.multicriteria.e4.ruleKey=cpp:M23_007
sonar.issue.ignore.multicriteria.e4.resourceKey=**/sm/database/database.cpp
sonar.issue.ignore.multicriteria.e5.ruleKey=cpp:M23_058
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*
sonar.issue.ignore.multicriteria.e6.ruleKey=cpp:S1181
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*

sonar.ws.timeout=600
