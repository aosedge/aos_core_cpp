# Ignore cpp:M23_007 (the value returned by a function shall be used) in the cloud protocol and
# OCI spec serialization code and in the CM and SM database implementations only: flagged on
# every Poco::JSON::Object::set() and Poco::JSON::Array::add() call, which return a reference to
# the object itself to allow call chaining. These files build JSON field by field, so casting
# each call to void would only add noise.
#
# Ignore cpp:M23_058 (builtin integer types should be replaced with aliases of explicit size):
# int, long and unsigned char are mostly dictated by the external APIs used throughout the code
# (POSIX file descriptors and return codes, signal handlers, Poco, curl, libnl, systemd, sqlite
# column types, gRPC channel arguments), and replacing only the remaining ones would mix two
# conventions for the same values.
#
# Ignore cpp:S1181 (generic exceptions should not be caught): catch (const std::exception&) is
# used at the module boundaries, where every exception thrown by std, Poco and other third-party
# code has to be converted to aos::Error. Catching narrower types would let the other exceptions
# escape from functions that report failures through the returned error.
#
# Ignore cpp:S7032 (the init-statement of a control statement should only declare variables):
# "if (err = Foo(); !err.IsNone())" is the error handling idiom of the project, used when the
# error variable is shared with a deferred rollback or is returned after the statement.
#
# Ignore cpp:S107 (functions should not have too many parameters): flagged on the Init methods
# and constructors, which receive all module dependencies as parameters since no dependency
# injection container is used.
#
# Ignore cpp:S5008 (avoid void*): flagged on the callbacks of C libraries (curl, libcrun,
# libnl, systemd journal, gRPC) where void* user data is the only option.
#
# Ignore cpp:S112 (generic exceptions should not be thrown): std::runtime_error is thrown only
# inside the modules and is converted to aos::Error at the module boundary, so dedicated exception
# classes would never be caught by type.
#
# Ignore cpp:M23_356 (prefer std::vector/std::array over C arrays): flagged on the string tables
# of the enum types, which are passed to aos::EnumStringer as C arrays, and on the buffers and
# tables required by C APIs (interface names, OpenSSL ASN1 templates).
#
# Ignore cpp:M23_388 (no global variables): flagged on the static members of the logger and on
# file-scope constant lookup tables, which are simplest as constants of the translation unit.
#
# Ignore cpp:M23_112 (if ... else if constructs shall be terminated with an else): the remaining
# chains select one of several optional cases and have nothing to do otherwise, so the final else
# would be empty.
#
# Ignore cpp:S6022 (prefer std::byte for byte-oriented memory access): uint8_t is used for byte
# buffers throughout the project and the core library, and char* is required by the C APIs.
#
# Ignore cpp:M23_404 (no <cctype> functions): std::isdigit and std::isalnum are used on ASCII
# names only, the <locale> alternatives would add nothing.
#
# Ignore cpp:S6009 (prefer std::string_view for read-only string parameters): the remaining
# parameters are stored in std::string members, are passed to Poco and std APIs which require
# std::string or a null-terminated string, or belong to signatures defined by Poco.
